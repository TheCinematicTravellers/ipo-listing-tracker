<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>F&O 1-Minute Scanner</title>
<style>body{font-family:Arial,sans-serif;background:#0b0f14;color:#e8edf3;margin:0}.wrap{max-width:1200px;margin:auto;padding:28px}h1{margin:0}.sub{color:#9aa7b5;margin:8px 0 24px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel{background:#111820;border:1px solid #27313c;border-radius:12px;padding:18px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px;border-bottom:1px solid #252e38}th{color:#9aa7b5}.green{color:#54d68b}.red{color:#ff6b6b}.yellow{color:#ffd166}.muted{color:#8996a5}.cards{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}.card{background:#111820;border:1px solid #27313c;border-radius:10px;padding:12px 16px}.num{font-size:22px;font-weight:700}.full{grid-column:1/-1}@media(max-width:850px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head>
<body><div class="wrap"><h1>F&O 1-Minute Scanner</h1><div class="sub" id="meta">Internal strategy dashboard · 9:16 Top 10 lock</div>
<div class="cards"><div class="card">Target <div class="num" id="target">-</div></div><div class="card">Locked <div class="num" id="locked">0</div></div><div class="card">Qualifying <div class="num" id="qualifying">0</div></div></div>
<div class="grid"><div class="panel"><h2 class="green">🟢 Top 10 Gainers @ 09:16</h2><div id="gainers">No snapshot yet.</div></div><div class="panel"><h2 class="red">🔴 Top 10 Losers @ 09:16</h2><div id="losers">No snapshot yet.</div></div><div class="panel full"><h2>Setups / Live State</h2><div id="setups">No setup snapshot yet.</div></div></div></div>
<script>
const esc=x=>String(x??'-').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');
const table=(rows,side)=>{if(!rows?.length)return '<span class="muted">No snapshot yet.</span>';return '<table><thead><tr><th>#</th><th>Stock</th><th>Change</th></tr></thead><tbody>'+rows.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x)}</td><td class="${side}">locked</td></tr>`).join('')+'</tbody></table>'};
fetch('state.json?ts='+Date.now()).then(r=>r.json()).then(d=>{document.getElementById('meta').textContent=`Updated ${d.updated_ist||'-'} IST · 208-stock universe · locked at 09:16`;document.getElementById('target').textContent=(d.target_r??'-')+'R';document.getElementById('locked').textContent=(d.locked||[]).length;document.getElementById('qualifying').textContent=Object.keys(d.setups||{}).length;document.getElementById('gainers').innerHTML=table(d.gainers,'green');document.getElementById('losers').innerHTML=table(d.losers,'red');let s=d.setups||{};document.getElementById('setups').innerHTML=Object.keys(s).length?'<table><thead><tr><th>Stock</th><th>Side</th><th>Body %</th><th>Entry</th><th>SL</th><th>Target</th><th>Status</th></tr></thead><tbody>'+Object.entries(s).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${esc(v.side)}</td><td>${Number(v.body_pct).toFixed(2)}%</td><td>${esc(v.entry)}</td><td>${esc(v.sl)}</td><td>${esc(v.target)}</td><td>${esc(v.status)}</td></tr>`).join('')+'</tbody></table>':'<span class="muted">No qualifying setup.</span>'}).catch(()=>{document.getElementById('meta').textContent='No live state published yet.'});
</script></body></html>
