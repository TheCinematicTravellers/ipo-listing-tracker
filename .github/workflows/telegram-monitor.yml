name: ORB Telegram Monitor

on:
  schedule:
    - cron: '*/5 9-15 * * 1-5'
      timezone: 'Asia/Kolkata'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check live ORB states
        env:
          MONITOR_URL: https://our-screener.vercel.app/api/telegram-monitor
          MONITOR_SECRET: ${{ secrets.MONITOR_SECRET }}
        run: |
          test -n "$MONITOR_SECRET" || { echo 'MONITOR_SECRET is not configured'; exit 1; }
          echo "Calling ORB monitor at $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          curl --fail-with-body --max-time 120 \
            -H "Authorization: Bearer ${MONITOR_SECRET}" \
            "${MONITOR_URL}"
