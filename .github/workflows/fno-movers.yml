name: Update NSE F&O Daily Movers

on:
  schedule:
    # 15:45 IST = 10:15 UTC, Monday-Friday.
    - cron: '15 10 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements_fno.txt
      - run: python update_fno_movers.py
      - name: Commit daily F&O movers
        run: |
          git config user.name "fno-movers-bot"
          git config user.email "actions@users.noreply.github.com"
          git add fno_movers.json
          if git diff --cached --quiet; then
            echo "No F&O mover changes"
          else
            git commit -m "Update NSE F&O daily movers"
            git push
          fi
