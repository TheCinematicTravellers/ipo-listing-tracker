name: SWIGGY cash S1 CI

on:
  push:
    branches:
      - feature/swiggy-cash-s1-forward-test
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install --upgrade pip pyotp smartapi-python requests pytest

      - name: Compile SWIGGY cash S1
        run: python -m py_compile swiggy_cash_s1/*.py

      - name: Run SWIGGY strategy tests
        run: pytest -q swiggy_cash_s1/test_strategy.py
