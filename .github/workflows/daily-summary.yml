name: ORB 4pm Daily Summary

on:
  schedule:
    - cron: '30 10 * * 1-5'
  workflow_dispatch:

env:
  TZ: Asia/Kolkata

jobs:
  daily-summary:
    runs-on: ubuntu-latest
    steps:
      - name: Send 4pm IST daily summary (test window 4:00-4:35 PM)
        env:
          MONITOR_URL: https://our-screener.vercel.app/api/telegram-monitor?summary=1
          MONITOR_SECRET: ${{ secrets.MONITOR_SECRET }}
        run: |
          curl --fail-with-body --max-time 120 \
            -H "Authorization: Bearer ${MONITOR_SECRET}" \
            "${MONITOR_URL}"
