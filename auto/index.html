<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>⚡ Our Screener - AUTO LIVE</title><style>body{font-family:Arial,sans-serif;background:#0b0f14;color:#e8edf3;margin:0}.wrap{max-width:1400px;margin:auto;padding:28px}h1{margin:0}.sub{color:#9aa7b5;margin:6px 0 22px}.btn{background:#1d8f5a;color:#fff;border:0;border-radius:9px;padding:11px 18px;font-weight:700;cursor:pointer}.btn:disabled{opacity:.6}.status{margin:14px 0;color:#9aa7b5}.summary{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 18px}.sum{background:#111820;border:1px solid #27313c;border-radius:10px;padding:10px 16px;font-weight:700}.sum b{font-size:18px;margin-left:5px}.target{color:#54d68b}.active{color:#7dd3fc}.sl{color:#ff6b6b}.pending{color:#9aa7b5}.invalid{color:#fbbf24}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel{background:#111820;border:1px solid #27313c;border-radius:12px;padding:18px;overflow:hidden}h2{margin-top:0}table{width:100%;border-collapse:collapse;table-layout:auto}th,td{text-align:right;padding:8px 5px;border-bottom:1px solid #252e38;font-size:13px;white-space:nowrap}th{color:#9aa7b5}th:first-child,td:first-child{width:30px;text-align:center}th:nth-child(2),td:nth-child(2){text-align:left;padding-left:4px;padding-right:8px}th:nth-child(3),td:nth-child(3){padding-left:3px;padding-right:6px}th:nth-child(4),td:nth-child(4),th:nth-child(5),td:nth-child(5),th:nth-child(6),td:nth-child(6),th:nth-child(7),td:nth-child(7){padding-left:5px;padding-right:5px}.green{color:#54d68b}.red{color:#ff6b6b}.muted{color:#8996a5}@media(max-width:900px){.grid{grid-template-columns:1fr}.wrap{padding:14px}.summary{gap:6px}.sum{padding:8px 10px;font-size:13px}th,td{padding:8px 4px;font-size:12px}}</style></head><body><div class="wrap"><h1>⚡ Our Screener · AUTO LIVE</h1><div class="sub">Live 208-stock NSE F&O scanner</div><button class="btn" id="refresh">🔄 Refresh Live Feed</button><div class="status" id="status">Ready. Click Refresh Live Feed.</div><div class="summary" id="summary"><div class="sum target">🎯 Target <b>0</b></div><div class="sum active">✅ Trade Active <b>0</b></div><div class="sum sl">❌ SL <b>0</b></div><div class="sum pending">⏳ Pending <b>0</b></div><div class="sum invalid">⚠️ Invalidated <b>0</b></div></div><div class="grid"><div class="panel"><h2 class="green">🟢 OPEN = LOW · Top 10</h2><div id="g">No live data yet.</div></div><div class="panel"><h2 class="red">🔴 OPEN = HIGH · Top 10</h2><div id="l">No live data yet.</div></div></div></div><script>const endpoint=location.hostname.endsWith('.github.io')?'https://ipo-listing-tracker-kiv3pm8hc-thecinematictravellers-1297.vercel.app/api/fno-movers':'/api/fno-movers';const n=x=>x==null||x===''?'-':Number(x).toLocaleString('en-IN',{maximumFractionDigits:2});const p=x=>x==null||x===''?'-':(Number(x)>=0?'+':'')+Number(x).toFixed(2)+'%';const v=x=>x==null||x===''?'-':Number(x).toLocaleString('en-IN');function table(rows,side){if(!rows?.length)return '<span class="muted">No eligible stocks.</span>';return `<table><thead><tr><th>#</th><th>Stock</th><th>Change %</th><th>Open</th><th>${side==='g'?'Low':'High'}</th><th>CMP</th><th>Daily Vol</th><th>Status</th></tr></thead><tbody>`+rows.map((x,i)=>`<tr><td>${i+1}</td><td>${x.symbol}</td><td class="${side==='g'?'green':'red'}">${p(x.change_pct)}</td><td>${n(x.open)}</td><td>${n(side==='g'?x.low:x.high)}</td><td>${n(x.cmp)}</td><td>${v(x.volume)}</td><td>${x.status||'⏳ Pending'}</td></tr>`).join('')+'</tbody></table>'}function updateSummary(rows){const counts={'🎯 Target':0,'✅ Trade Active':0,'❌ SL':0,'⏳ Pending':0,'⚠️ Invalidated level':0};for(const x of rows||[]){const s=x.status||'⏳ Pending';if(s in counts)counts[s]++;}document.getElementById('summary').innerHTML=`<div class="sum target">🎯 Target <b>${counts['🎯 Target']}</b></div><div class="sum active">✅ Trade Active <b>${counts['✅ Trade Active']}</b></div><div class="sum sl">❌ SL <b>${counts['❌ SL']}</b></div><div class="sum pending">⏳ Pending <b>${counts['⏳ Pending']}</b></div><div class="sum invalid">⚠️ Invalidated <b>${counts['⚠️ Invalidated level']}</b></div>`}async function refresh(){const b=document.getElementById('refresh'),s=document.getElementById('status');b.disabled=true;s.textContent='Fetching fresh data… ⏳';try{const r=await fetch(endpoint,{method:'GET',cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();document.getElementById('g').innerHTML=table(d.gainers,'g');document.getElementById('l').innerHTML=table(d.losers,'l');updateSummary([...(d.gainers||[]),...(d.losers||[])]);s.textContent=`Updated ${d.updated_ist} · IST · ${d.available}/${d.universe_size} stocks`;}catch(e){s.textContent='AUTO feed unavailable: '+e.message+' · Manual mode remains available.';}finally{b.disabled=false}}document.getElementById('refresh').onclick=refresh;</script></body></html>
