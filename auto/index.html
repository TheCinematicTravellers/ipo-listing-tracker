<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>⚡ Our Screener - AUTO LIVE</title><style>body{font-family:Arial,sans-serif;background:#0b0f14;color:#e8edf3;margin:0}.wrap{max-width:1250px;margin:auto;padding:28px}h1{margin:0}.sub{color:#9aa7b5;margin:6px 0 22px}.btn{background:#1d8f5a;color:#fff;border:0;border-radius:9px;padding:11px 18px;font-weight:700;cursor:pointer}.btn:disabled{opacity:.6}.status{margin:14px 0;color:#9aa7b5}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel{background:#111820;border:1px solid #27313c;border-radius:12px;padding:18px}h2{margin-top:0}table{width:100%;border-collapse:collapse}th,td{text-align:right;padding:9px;border-bottom:1px solid #252e38;font-size:13px}th{color:#9aa7b5}th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left}.green{color:#54d68b}.red{color:#ff6b6b}.muted{color:#8996a5}@media(max-width:900px){.grid{grid-template-columns:1fr}.wrap{padding:14px}}</style></head><body><div class="wrap"><h1>⚡ Our Screener · AUTO LIVE</h1><div class="sub">Live 208-stock NSE F&O scanner</div><button class="btn" id="refresh">🔄 Refresh Live Feed</button><div class="status" id="status">Ready. Click Refresh Live Feed.</div><div class="grid"><div class="panel"><h2 class="green">🟢 OPEN = LOW · Top 10</h2><div id="g">No live data yet.</div></div><div class="panel"><h2 class="red">🔴 OPEN = HIGH · Top 10</h2><div id="l">No live data yet.</div></div></div></div><script>
const endpoint='https://YOUR-SERVERLESS-ENDPOINT.example.com/api/fno-movers';
const n=x=>x==null||x===''?'-':Number(x).toLocaleString('en-IN',{maximumFractionDigits:2});
const p=x=>x==null||x===''?'-':(Number(x)>=0?'+':'')+Number(x).toFixed(2)+'%';
const v=x=>x==null||x===''?'-':Number(x).toLocaleString('en-IN');
function table(rows,side){if(!rows?.length)return '<span class="muted">No eligible stocks.</span>';return `<table><thead><tr><th>#</th><th>Stock</th><th>Change %</th><th>Open</th><th>${side==='g'?'Low':'High'}</th><th>CMP</th><th>Volume</th></tr></thead><tbody>`+rows.map((x,i)=>`<tr><td>${i+1}</td><td>${x.symbol}</td><td class="${side==='g'?'green':'red'}">${p(x.change_pct)}</td><td>${n(x.open)}</td><td>${n(side==='g'?x.low:x.high)}</td><td>${n(x.cmp)}</td><td>${v(x.volume)}</td></tr>`).join('')+'</tbody></table>'}
async function refresh(){const b=document.getElementById('refresh'),s=document.getElementById('status');b.disabled=true;s.textContent='Fetching fresh Angel One data…';try{const r=await fetch(endpoint,{method:'GET',cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();document.getElementById('g').innerHTML=table(d.gainers,'g');document.getElementById('l').innerHTML=table(d.losers,'l');s.textContent=`Updated ${d.updated_ist} · IST · ${d.available}/${d.universe_size} stocks`;}catch(e){s.textContent='AUTO feed unavailable: '+e.message+' · Manual mode remains available.';}finally{b.disabled=false}}document.getElementById('refresh').onclick=refresh;</script></body></html>
